.view{display:grid;gap:40px}
.lead{max-width:62ch;color:var(--muted);margin-top:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:24px}
.fact{border-top:3px solid var(--fg);padding-top:10px}
.fact b{display:block;font-family:var(--display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em}
.fact span{color:var(--muted);font-size:.95rem}
.week{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.04em;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--fg);text-decoration:none}
.chip i{font-style:normal;display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--d,var(--line))}
.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.day{display:grid;gap:18px;scroll-margin-top:16px}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;border-bottom:4px solid var(--d);padding-bottom:8px}
.dayhead .tag{font-family:var(--display);font-weight:700;color:var(--d);font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase}
.dayhead p{color:var(--muted);flex-basis:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ex svg{display:block;width:100%;height:auto;background:color-mix(in srgb,var(--d) 7%,var(--surface));border-bottom:1px solid var(--line)}
.exbody{padding:14px 16px 16px;display:grid;gap:8px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.num{font-family:var(--display);font-weight:700;color:var(--d);font-size:1.1rem}
.dose{display:flex;flex-wrap:wrap;gap:6px}
.dose span{font-variant-numeric:tabular-nums;font-size:.85rem;font-weight:600;padding:2px 8px;border-radius:4px;background:color-mix(in srgb,var(--d) 14%,transparent);color:var(--fg)}
.ex ul{margin:0;padding-left:18px;font-size:.95rem;display:grid;gap:2px}
.alt{font-size:.88rem;color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.rules div{display:grid;gap:6px}
.rules ul{margin:0;padding-left:18px;color:var(--muted)}
.note{font-size:.88rem;color:var(--muted)}

const NS='http://www.w3.org/2000/svg';
const FRONT=[['lh','lk','la'],['rh','rk','ra'],['lh','rh'],['n','pc'],['ls','rs'],['ls','le','lw'],['rs','re','rw']];
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e}
function pose(p,u){const o={},B=p.b||{},A=Object.assign({},p.a,p.add||{});for(const k in A)o[k]=B[k]?[A[k][0]+(B[k][0]-A[k][0])*u,A[k][1]+(B[k][1]-A[k][1])*u]:A[k];return o}
function pt(P,ref){return typeof ref==='string'?P[ref]:ref}
function draw(g,p,Q,day,ghost){
  g.textContent='';
  const col=ghost?'var(--ghost)':'var(--fig)';
  const chains=p.front?FRONT:(p.chains||SIDE);
  for(const c of chains){const pts=c.filter(k=>Q[k]).map(k=>Q[k].join(',')).join(' ');
    const torso=(c[0]==='s'&&c[1]==='p')||(c[0]==='n'&&c[1]==='pc');
    g.appendChild(el('polyline',{points:pts,fill:'none',stroke:col,'stroke-width':torso?11:7,'stroke-linecap':'round','stroke-linejoin':'round'}))}
  g.appendChild(el('circle',{cx:Q.h[0],cy:Q.h[1],r:8,fill:col}));
  if(ghost)return;
  for(const r of p.pr){
    if(r.t==='cable'){const a=pt(Q,r.from),b=pt(Q,r.to);g.insertBefore(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'var(--equip)','stroke-width':1.5}),g.firstChild)}
    else if(r.t==='plate'){const c=Q[r.at];g.appendChild(el('circle',{cx:c[0],cy:c[1],r:r.r,fill:day}));g.appendChild(el('circle',{cx:c[0],cy:c[1],r:2.5,fill:'var(--surface)'}))}
    else if(r.t==='pad'){const c=Q[r.at];g.appendChild(el('circle',{cx:c[0],cy:c[1],r:r.r,fill:'var(--equip)'}))}
    else if(r.t==='seg'){const c=Q[r.at];g.appendChild(el('line',{x1:c[0]+r.d[0][0],y1:c[1]+r.d[0][1],x2:c[0]+r.d[1][0],y2:c[1]+r.d[1][1],stroke:'var(--equip)','stroke-width':r.w,'stroke-linecap':'round'}))}
  }
  for(const k of (p.dbs||(p.db?['w']:[]))){const c=Q[k];
    g.appendChild(el('rect',{x:c[0]-7,y:c[1]-3,width:14,height:6,rx:2,fill:day}))}
}
function staticProps(svg,p){
  for(const r of p.pr){
    if(r.t==='floor')svg.appendChild(el('line',{x1:0,y1:140,x2:200,y2:140,stroke:'var(--equip)','stroke-width':2}));
    else if(r.t==='rect')svg.appendChild(el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx:1.5,fill:'var(--equip)'}));
    else if(r.t==='line')svg.appendChild(el('polyline',{points:r.pts.map(q=>q.join(',')).join(' '),fill:'none',stroke:'var(--equip)','stroke-width':r.w,'stroke-linecap':'round','stroke-linejoin':'round'}));
  }
}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
const live=[],views={};
const root=document.getElementById('views');
for(const per of PEOPLE){
  const v=h('div','view');v.id='view-'+per.id;views[per.id]=v;
  const head=h('header');
  head.appendChild(h('h1',null,per.title));
  head.appendChild(h('p','lead',per.lead));
  const nav=h('nav','week');nav.setAttribute('aria-label','Træningsdage for '+per.name);
  for(const d of per.days){const a=h('a','chip','<i></i>'+d.tag+' · '+d.title);a.href='#'+d.id;a.style.setProperty('--d','var(--'+d.key+')');nav.appendChild(a)}
  head.appendChild(nav);
  const facts=h('div','facts');for(const f of per.facts)facts.appendChild(h('div','fact','<b>'+f[0]+'</b><span>'+f[1]+'</span>'));
  head.appendChild(facts);v.appendChild(head);
  const main=h('main');main.style.cssText='display:grid;gap:44px';
  for(const d of per.days){
    const sec=h('section','day');sec.id=d.id;sec.style.setProperty('--d','var(--'+d.key+')');
    sec.innerHTML='<div class="dayhead"><span class="tag">'+d.tag+'</span><h2>'+d.title+'</h2><p>'+d.why+'</p></div>';
    const grid=h('div','grid');
    d.ex.forEach((x,i)=>{
      const [pid,name,dose,cues,alt]=x,p=P[pid],col='var(--'+d.key+')';
      const card=h('article','ex');
      const svg=el('svg',{viewBox:'0 -12 200 160',role:'img','aria-label':'Illustration af '+name});
      staticProps(svg,p);
      const gg=el('g',{opacity:.16}),gl=el('g',{});svg.appendChild(gg);svg.appendChild(gl);
      if(p.b)draw(gg,p,pose(p,1),col,true);
      draw(gl,p,pose(p,0),col,false);
      card.appendChild(svg);
      card.appendChild(h('div','exbody','<div class="top"><h3>'+name+'</h3><span class="num">'+(d.key.length>1?'D'+d.key.slice(1):d.key.toUpperCase())+'.'+(i+1)+'</span></div>'+
        '<div class="dose">'+dose.map(s=>'<span>'+s+'</span>').join('')+'</div>'+
        '<ul>'+cues.map(s=>'<li>'+s+'</li>').join('')+'</ul><p class="alt">Alternativ: '+alt+'</p>'));
      grid.appendChild(card);
      live.push({g:gl,p:p,c:col,off:i*.37,v:v,fast:pid==='walk'});
    });
    sec.appendChild(grid);main.appendChild(sec);
  }
  v.appendChild(main);
  const rules=h('section','rules');rules.setAttribute('aria-label','Gode råd');
  for(const r of per.rules)rules.appendChild(h('div',null,'<h3>'+r[0]+'</h3><ul>'+r[1].map(s=>'<li>'+s+'</li>').join('')+'</ul>'));
  v.appendChild(rules);
  root.appendChild(v);
}
function route(){
  const hs=location.hash.slice(1);
  const who=(hs==='michaella'||hs.indexOf('m-')===0)?'michaella':'christian';
  for(const id in views)views[id].hidden=id!==who;
  for(const id in views){const t=document.getElementById('tab-'+id);if(id===who)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')}
  if(hs===who)window.scrollTo(0,0);
  document.title=who==='michaella'?'Michaellas Træning':'Christians Træning';
}
window.addEventListener('hashchange',route);route();
let still=false;try{still=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
if(!still){
  function tick(now){
    for(const L of live){if(L.v.hidden)continue;const T=L.fast?1100:2600;const ph=((now/T)+L.off)%1;const tri=ph<.5?ph*2:2-ph*2;const u=tri*tri*(3-2*tri);draw(L.g,L.p,pose(L.p,u),L.c,false)}
    requestAnimationFrame(tick)}
  requestAnimationFrame(tick);
}
})();
</script>
